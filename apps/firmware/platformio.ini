; PlatformIO project for the arena box firmware. See README.md.
;   pio run                  build
;   pio run -t upload        build and flash over USB
;   pio device monitor       serial monitor (Ctrl+C to quit)

[platformio]
default_envs = heltec_v2

; Heltec WiFi LoRa 32 V2: original ESP32 (D0WDQ6), 8 MB flash, CP2102 USB.
; Not the V3 (ESP32-S3): esptool refuses to flash an S3 build onto it.
[env:heltec_v2]
; pioarduino: community platform with Arduino core 3.x (the official
; espressif32 platform is stuck on core 2.x). Pinned to a release so an
; update can't change the build under us.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; config.h (git-ignored, downloaded from the web app) sits next to this file
build_flags = -I"${PROJECT_DIR}"
lib_deps =
  bblanchon/ArduinoJson@7.4.3

; ESP32 DevKit comum (ESP32-WROOM-32, 4 MB de flash): a PCB com os botões, os
; dois LCDs e a fita. Mesmo chip da V2, só muda a placa:
;   pio run -e esp32dev -t upload
[env:esp32dev]
extends = env:heltec_v2
board = esp32dev

; Testes da lógica do protocolo (lib/ArenaLogic) no computador, sem a placa:
;   pio test -e native
; Precisa de um compilador C++ no host (no macOS: Xcode Command Line Tools).
[env:native]
platform = native
test_framework = unity
lib_deps =
  bblanchon/ArduinoJson@7.4.3
lib_ignore = WebSockets
