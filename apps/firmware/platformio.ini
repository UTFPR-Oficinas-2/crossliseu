; PlatformIO project for the arena box firmware. See README.md.
;   pio run                  build
;   pio run -t upload        build and flash over USB
;   pio device monitor       serial monitor (Ctrl+C to quit)

[platformio]
default_envs = esp32dev

; Any board with the original ESP32 chip (ESP32-WROOM-32 / WROVER): the DevKit
; of the box PCB and most ESP32 dev boards. Not the S2, S3, C3 or C6: esptool
; refuses those builds.
; The pins are in src/pins.h; the defaults are the box PCB's.
[env:esp32dev]
; pioarduino: community platform with Arduino core 3.x (the official
; espressif32 platform is stuck on core 2.x). Pinned to a release so an
; update can't change the build under us.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; config.h (git-ignored, downloaded from the web app) sits next to this file
build_flags = -I"${PROJECT_DIR}"
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  ; LCDs 16x2 I2C (#39); aceita um TwoWire, então cada LCD fica no seu barramento
  https://github.com/mathertel/LiquidCrystal_PCF8574.git#2.3.0

; A board wired differently: copy this env, uncomment it and change the pins
; (names in src/pins.h), then pio run -e my_board -t upload. See README.md.
; [env:my_board]
; extends = env:esp32dev
; build_flags = ${env:esp32dev.build_flags} -DPIN_ONBOARD_LED=4 -DPIN_SURRENDER_A=13

; Testes da lógica do protocolo (lib/ArenaLogic), do debounce (lib/Buttons), do texto dos LCDs (lib/Display) e das cores da fita (lib/Led) no computador, sem a placa:
;   pio test -e native
; Precisa de um compilador C++ no host (no macOS: Xcode Command Line Tools).
[env:native]
platform = native
test_framework = unity
lib_deps =
  bblanchon/ArduinoJson@7.4.3
lib_ignore = WebSockets
