# NGINX config *inside* the web container. The host NGINX strips the
# /crossliseu prefix before forwarding, so here the app lives at "/".
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build files never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /about) fall back to index.html
    # so Vue Router can handle them.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
