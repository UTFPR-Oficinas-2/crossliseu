# Production stack for the VPS.
#   Step 1 (build on the VPS):   docker compose -f compose.prod.yml up -d --build
#   Step 2 (images from GHCR):   docker compose -f compose.prod.yml pull && docker compose -f compose.prod.yml up -d
#
# Ports are bound to 127.0.0.1 only: the outside world reaches the app
# through the host NGINX, never directly.
name: crossliseu

services:
  api:
    image: ghcr.io/utfpr-oficinas-2/crossliseu-api:${IMAGE_TAG:-latest}
    build:
      context: ./apps/api
      target: prod
    # Node as PID 1 ignores SIGTERM; tini forwards it so shutdown hooks run
    init: true
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:8011:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/utfpr-oficinas-2/crossliseu-web:${IMAGE_TAG:-latest}
    build:
      context: ./apps/web
      target: prod
      args:
        BASE_PATH: /crossliseu/
        VITE_API_URL: /crossliseu/api
    ports:
      - "127.0.0.1:8010:8080"
    restart: unless-stopped

  # Analysis jobs between the API and the CV worker. No published ports: only
  # containers on this compose network can reach it.
  rabbitmq:
    image: rabbitmq:4.1
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crossliseu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  cv-worker:
    image: ghcr.io/utfpr-oficinas-2/crossliseu-cv-worker:${IMAGE_TAG:-latest}
    build:
      context: ./apps/cv-worker
    init: true
    # Only what the worker needs: it decodes user-uploaded video, so it must not
    # see the API's secrets (JWT, database, admin seed).
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crossliseu}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # Pin the minor version; bump it on purpose (same major keeps the data compatible)
    image: postgres:18.6-trixie
    # Loopback only, for SSH tunnels (ssh -L 5433:localhost:5432 ediasv.dev).
    # Never drop the 127.0.0.1: Docker's iptables rules bypass UFW.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
