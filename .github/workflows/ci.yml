# Step 3: checks that must pass before a pull request can be merged into main.
# Also reused by deploy.yml so nothing is deployed without passing them.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --passWithNoTests

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      # The npm "lint" script uses --fix; in CI we only check.
      - run: npx oxlint .
      - run: npx eslint .
      - run: npx vitest run --passWithNoTests
      - run: npm run build-only -- --base=/crossliseu/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          target: prod
          build-args: BASE_PATH=/crossliseu/
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
