# Step 2: every push to main (i.e. every merged PR) is tested, built into
# Docker images on GitHub's machines, pushed to GHCR, and rolled out on the VPS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual "Run workflow" button

# Never run two deploys at the same time; queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/utfpr-oficinas-2/crossliseu # must be lowercase

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & push ${{ matrix.app }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          target: prod
          build-args: BASE_PATH=/crossliseu/
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /opt/crossliseu
            git fetch --quiet origin main
            git reset --hard origin/main
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f compose.prod.yml pull api web
            docker compose -f compose.prod.yml up -d --wait postgres
            docker compose -f compose.prod.yml run --rm api npx typeorm migration:run -d dist/database/data-source.js
            docker compose -f compose.prod.yml up -d --remove-orphans
            docker image prune -f
            echo "Deployed ${IMAGE_TAG}"
