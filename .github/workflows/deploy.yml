# Step 2: every push to main (i.e. every merged PR) is tested, built into
# Docker images on GitHub's machines, pushed to GHCR, and rolled out on the VPS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual "Run workflow" button

# Never run two deploys at the same time; queue them instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# No token permissions by default; each job opts in to what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/utfpr-oficinas-2/crossliseu # must be lowercase

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build & push ${{ matrix.app }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/${{ matrix.app }}
          target: prod
          build-args: |
            BASE_PATH=/crossliseu/
            VITE_API_URL=/crossliseu/api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /opt/crossliseu
            git fetch --quiet origin main
            git reset --hard origin/main
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f compose.prod.yml pull api web
            docker compose -f compose.prod.yml up -d --wait postgres
            docker compose -f compose.prod.yml run --rm api npx typeorm migration:run -d dist/database/data-source.js
            docker compose -f compose.prod.yml up -d --remove-orphans
            docker image prune -f
            echo "Deployed ${IMAGE_TAG}"
