services:

  api:
    build:
      context: ./apps/api
      target: dev

    env_file:
        - ./.env

    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"

    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev

    environment:
      - NODE_ENV=development
      # Vite dev proxy target for VITE_API_URL=/api (see apps/web/vite.config.ts)
      - API_PROXY_TARGET=http://api:3000

    ports:
      - "5173:5173"

    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

  postgres:
    image: postgres:18-bookworm

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
