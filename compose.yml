services:

  api:
    build:
      context: ./apps/api
      target: dev
    # Forwards signals so Ctrl+C / docker compose stop are instant
    init: true

    env_file:
        - ./.env

    environment:
      NODE_ENV: development
      # Overrides .env, so the same .env also works when running the API on the host
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./apps/api:/app
      # Refreshed by the image's dev-entrypoint when package-lock.json changes
      - api_node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    init: true

    environment:
      - NODE_ENV=development
      # Without this the dev server shows demo data instead of calling the API
      - VITE_API_URL=/api
      # Vite dev proxy target for VITE_API_URL=/api (see apps/web/vite.config.ts)
      - API_PROXY_TARGET=http://api:3000

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

  postgres:
    # Same image as compose.prod.yml
    image: postgres:18.6-trixie

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
