services:

  api:
    build:
      context: ./apps/api
      target: dev
    # Forwards signals so Ctrl+C / docker compose stop are instant
    init: true

    env_file:
        - ./.env

    environment:
      NODE_ENV: development
      # Overrides .env, so the same .env also works when running the API on the host
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./apps/api:/app
      # Refreshed by the image's dev-entrypoint when package-lock.json changes
      - api_node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    init: true

    environment:
      - NODE_ENV=development
      # Without this the dev server shows demo data instead of calling the API
      - VITE_API_URL=/api
      # Vite dev proxy target for VITE_API_URL=/api (see apps/web/vite.config.ts)
      - API_PROXY_TARGET=http://api:3000

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

  postgres:
    # Same image as compose.prod.yml
    image: postgres:18.6-trixie

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Analysis jobs between the API and the CV worker (queues analysis.requested / .finished).
  # Management UI: http://localhost:15672 (RABBITMQ_USER / RABBITMQ_PASSWORD)
  rabbitmq:
    image: rabbitmq:4.1-management

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crossliseu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-crossliseu}

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 10

  cv-worker:
    build:
      context: ./apps/cv-worker
    init: true

    # Only what the worker needs: it decodes user-uploaded video, so it must not see the API's
    # secrets (JWT, database, admin seed), which a plain `env_file: ./.env` would hand over.
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crossliseu}:${RABBITMQ_PASSWORD:-crossliseu}@rabbitmq:5672/
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      # Mock mode is opt-in (dev only): when set, every job runs the pipeline on this test video
      # instead of the recording, and the results are NOT from the uploaded video. Empty or unset
      # means real processing.
      CV_MOCK_VIDEO: ${CV_MOCK_VIDEO:-}

    volumes:
      - ./apps/cv-worker/data/videos:/app/data/videos:ro

    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
  rabbitmq_data:
