# /etc/nginx/sites-available/ediasv.dev
#
# One server block for the whole portfolio domain. Each project adds its own
# "location" rules as a small file in /etc/nginx/snippets/ediasv.dev/,
# so adding a new project never means editing this file.
#
# certbot --nginx will add the HTTPS (listen 443 ssl) lines and the
# HTTP -> HTTPS redirect to this file automatically.

server {
    listen 80;
    listen [::]:80;
    server_name ediasv.dev www.ediasv.dev;

    # Recordings are uploaded straight to R2, so the API only needs a modest limit.
    client_max_body_size 10m;

    # Landing page for the portfolio root (replace with a real site later).
    location = / {
        default_type text/plain;
        return 200 "ediasv.dev\n";
    }

    # Every project's routes
    include /etc/nginx/snippets/ediasv.dev/*.conf;
}
