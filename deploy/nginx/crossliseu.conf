# /etc/nginx/snippets/ediasv.dev/crossliseu.conf
#
#   https://ediasv.dev/crossliseu/       -> web container (127.0.0.1:8010)
#   https://ediasv.dev/crossliseu/api/   -> api container (127.0.0.1:8011)
#
# The trailing "/" in proxy_pass strips the matched prefix, so the containers
# never need to know they live under /crossliseu.

location = /crossliseu {
    return 301 /crossliseu/;
}

location /crossliseu/api/ {
    proxy_pass http://127.0.0.1:8011/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /crossliseu/api;

    # WebSocket support (referee/host live updates, ESP32)
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
}

location /crossliseu/ {
    proxy_pass http://127.0.0.1:8010/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
